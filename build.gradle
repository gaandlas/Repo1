plugins {
    id 'groovy'
    id 'com.katalon.gradle-plugin' version "0.1.1"
}

version = '0.4'

repositories {
    mavenCentral()
}

dependencies {
	// https://mvnrepository.com/artifact/software.amazon.awssdk/ssm
	implementation group: 'software.amazon.awssdk', name: 'ssm', version: '2.20.132'
	
	// https://mvnrepository.com/artifact/software.amazon.awssdk/dynamodb
	implementation group: 'software.amazon.awssdk', name: 'dynamodb', version: '2.20.135'
	
	// https://mvnrepository.com/artifact/software.amazon.awssdk/s3
	implementation group: 'software.amazon.awssdk', name: 's3', version: '2.20.149'
	
	// https://mvnrepository.com/artifact/software.amazon.awssdk/s3-transfer-manager
	implementation group: 'software.amazon.awssdk', name: 's3-transfer-manager', version: '2.20.149'
	
	// https://mvnrepository.com/artifact/org.seleniumhq.selenium/selenium-java
	implementation group: 'org.seleniumhq.selenium', name: 'selenium-java', version: '4.11.0'

	// https://mvnrepository.com/artifact/com.opencsv/opencsv
	implementation group: 'com.opencsv', name: 'opencsv', version: '5.8'

	// https://mvnrepository.com/artifact/com.univocity/univocity-parsers
	implementation group: 'com.univocity', name: 'univocity-parsers', version: '2.9.1'

}

// typing "$gradle katalonCopyDependencies" will insert 14 jar files for AWS Java SDK for Amazon S3